<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfcf9">
<title>결. — V7 / V8.2 비교</title>
<link rel="stylesheet" href="./styles.css?v=8.2">
<script defer src="./orb-renderer.js?v=8.2"></script>
<script defer src="./app.js?v=8.2"></script>
<style>
.compare-app{max-width:760px;margin:0 auto;background:#fbfcf9;min-height:100dvh;padding:27px 24px 50px}
.compare-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:19px;border-bottom:1px solid #e8ebe7}
.compare-brand{font-size:25px;font-weight:560;letter-spacing:-.08em;text-decoration:none;color:#272a27}
.compare-back{font-size:12px;text-decoration:none;color:#858982}
.compare-intro{margin-top:41px}
.compare-intro h1{font-size:25px;font-weight:560;letter-spacing:-.06em;margin:0}
.compare-intro p{font-size:12px;line-height:1.7;color:#8c938a;margin:13px 0 0}
.sample-row{display:flex;gap:6px;flex-wrap:wrap;margin:23px 0 26px}
.sample-row button{font-size:12px;background:#fff;color:#4c534c;border:1px solid #e2e6df;padding:9px 12px;border-radius:7px}
.sample-row button.active{background:#2c332e;color:white;border-color:#2c332e}
.compare-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}
.compare-panel{border:1px solid #e9ede7;background:#fff;border-radius:13px;padding:13px 6px 19px;text-align:center;min-width:0}
.compare-panel h2{font-size:13px;font-weight:550;margin:5px 0 1px}
.compare-panel p{font-size:11px;color:#999f96;margin:0}
.compare-panel .preview{min-height:220px;gap:0;padding:14px 0}
.compare-panel .preview>.orb{height:min(33vw,172px);width:min(33vw,172px);max-height:172px;max-width:172px;flex:none}
.compare-tips{font-size:12px;line-height:1.8;color:#7c857b;margin:23px 2px 0}
.compare-status{font-size:11px;color:#8f948d;margin:12px 2px}
.compare-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.compare-links a{font-size:12px;color:#333b34;text-decoration:none;border-bottom:1px solid #91998f;padding:4px 0}
@media(min-width:560px){.compare-panel .preview>.orb{height:190px;width:190px;max-height:none;max-width:none}.compare-panel .preview{min-height:259px}}
@media(max-width:370px){.compare-app{padding-left:15px;padding-right:15px}.compare-pair{gap:8px}.compare-panel .preview{min-height:192px}}
</style>
</head>
<body data-page="compare">
<main class="compare-app">
<header class="compare-head"><a href="./" class="compare-brand">결.</a><a class="compare-back" href="./">돌아가기 ↗</a></header>
<div class="compare-intro">
  <h1>구슬 비교</h1>
  <p>같은 감정, 다른 빛. V7은 기존 방식이고 V8.2는 더 부드러운 빛과 박동을 적용한 셰이더야.</p>
</div>
<div class="sample-row" role="group" aria-label="감정 색상 비교">
  <button type="button" data-sample="blue" class="active">슬픔</button>
  <button type="button" data-sample="two">기쁨 · 슬픔</button>
  <button type="button" data-sample="three">기쁨 · 슬픔 · 불안</button>
  <button type="button" data-sample="four">4색</button>
</div>
<div class="compare-pair">
  <section class="compare-panel"><h2>V7</h2><p>기존 발광 효과</p><div class="preview"><div class="orb" id="legacy-orb"></div></div></section>
  <section class="compare-panel"><h2>V8.2</h2><p>WebGL2 셰이더</p><div class="preview"><div class="orb" id="shader-orb"></div></div></section>
</div>
<p class="compare-status" id="render-status" role="status">렌더러 확인 중</p>
<p class="compare-tips">테두리, 내부 빛의 움직임, 감정색을 따라 달라지는 바깥 후광을 비교해 봐. V8.2은 아직 실험 버전이야.</p>
<div class="compare-links">
  <a href="./?renderer=legacy&v=8.2">V7 앱</a>
  <a href="./?renderer=webgl&v=8.2">V8.2 앱 실험하기</a>
</div>
</main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const presets={
    blue:['#3389EF'],
    two:['#FFD02F','#3389EF'],
    three:['#FFD02F','#3389EF','#9557E6'],
    four:['#FFD02F','#3389EF','#9557E6','#F36E9D']
  };
  const legacy=document.getElementById('legacy-orb'),
    newer=document.getElementById('shader-orb'),
    status=document.getElementById('render-status');
  const shader=window.GyeolShader?.create();
  function select(name){
    const old=window.GyeolPreview;
    const colors=[...(presets[name]||presets.blue)].sort((a,b)=>old.hue(a)-old.hue(b));
    if(old){
      legacy.style.background=old.orbStyleForColors(colors);
      legacy.style.setProperty('--orb-halo',old.emotionGlow(colors,.22));
      legacy.style.setProperty('--orb-halo-strong',old.emotionGlow(colors,.34));
    }
    if(shader){
      const ok=shader.mount(newer,colors);
      status.textContent=ok?'왼쪽 V7 · 오른쪽 V8.2 (실시간 셰이더)':'WebGL2를 사용할 수 없어 V7만 표시하고 있어.';
    }else{
      newer.style.background=old?.orbStyleForColors(colors)||colors[0];
      status.textContent='이 브라우저에서는 WebGL2를 사용할 수 없어 V8.2 대신 정적 구슬을 표시하고 있어.';
    }
    document.querySelectorAll('[data-sample]').forEach(el=>el.classList.toggle('active',el.dataset.sample===name));
  }
  document.querySelectorAll('[data-sample]').forEach(el=>el.addEventListener('click',()=>select(el.dataset.sample)));
  select('blue');
});
</script>
</body>
</html>
